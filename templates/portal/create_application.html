{% extends 'portal/base.html' %}
{% block title %}Новая заявка | GosdumaMusic{% endblock %}
{% block content %}
<section class="card form-card">
    <h1>Формирование музыкальной заявки</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <label class="field-label">{{ field.label }} {{ field }}</label>
            {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
        {% endfor %}
        <button type="submit" class="btn">Отправить</button>
    </form>
</section>
{% endblock %}
